[project]
name = "foodbank-agent"
version = "0.1.0"
description = "AI chat interface for foodbank admins"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.35.0",
    "openai>=1.0.0",
    "pandas>=2.2.0",
    "plotly>=5.22.0",
    "openpyxl>=3.1.2",
    "python-dateutil>=2.9.0",
    "gspread>=6.2.1",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long — decorative section comments exceed 120 chars
]

[tool.ruff.lint.isort]
known-first-party = ["agent", "app", "config", "log_config", "sheets", "tool_schemas", "tools"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
